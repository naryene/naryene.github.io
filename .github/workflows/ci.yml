name: CI
on:
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

  pull_request:

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      refresh_blogroll:
        description: "Refresh the blogroll cache before building"
        type: boolean
        default: false

jobs:
  CI:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    # Every event validates first: the cache format is the contract that lets
    # `build` run offline, so a broken cache or parser must fail before we
    # refresh or publish anything.
    - run: deno task test

    # Scheduled (and opt-in manual) runs refresh the cache in the ephemeral
    # checkout only: the refreshed entries are deployed, but never committed.
    - name: Refresh blogroll cache
      if: github.event_name == 'schedule' || inputs.refresh_blogroll
      run: deno task update-blogroll

    # Pushes and pull requests build straight from the committed cache, without
    # any network.
    - run: deno task build

    - name: Deploy
      if: github.event_name != 'pull_request'
      uses: peaceiris/actions-gh-pages@364c31d33bb99327c77b3a5438a83a357a6729ad # v3.4.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: out/res
        force_orphan: true
